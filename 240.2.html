<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<title>OSRS Cache Diff Report</title>
<style>
:root{color-scheme:dark;--bg:#151719;--panel:#202326;--panel2:#262a2e;--border:#343a40;--text:#d8dde3;--muted:#8d99a6;--blue:#7cc7ff;--green:#91d18b;--red:#f28b82;--amber:#f7c873;}
*{box-sizing:border-box;}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);margin:0;padding:0;font-size:14px;line-height:1.35;}
header{position:sticky;top:0;z-index:10;background:#1b1e21;border-bottom:1px solid var(--border);padding:12px 18px;display:flex;align-items:center;gap:14px;box-shadow:0 2px 10px #0004;}
h1{margin:0;color:#f2f6fb;font-size:20px;font-weight:650;}
.actions{margin-left:auto;display:flex;gap:8px;}
#content{max-width:1800px;margin:0 auto;padding:14px 18px 28px;}
section{background:var(--panel);border:1px solid var(--border);border-radius:8px;margin:0 0 12px;overflow:hidden;}
summary{cursor:pointer;font-weight:650;color:var(--blue);list-style:none;}
summary::-webkit-details-marker{display:none;}
.section-summary{display:flex;align-items:center;gap:10px;padding:12px 14px;}
.section-summary:before{content:'+';color:var(--muted);font-family:Consolas,monospace;width:14px;}
details[open]>.section-summary:before{content:'-';}
.section-title{min-width:190px;}
.badge{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--border);border-radius:999px;padding:2px 8px;background:#15181b;color:var(--muted);font-size:12px;font-weight:600;}
.body{border-top:1px solid var(--border);padding:12px 14px 16px;}
.bucket{border:1px solid var(--border);border-radius:6px;background:#181b1e;margin:0 0 8px;overflow:hidden;}
.bucket>.section-summary{padding:8px 10px;}
.bucket>.body{padding:10px;border-top:1px solid var(--border);}
.subhead{margin:14px 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);}
.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:6px;background:#181b1e;margin:0 0 12px;}
table{border-collapse:collapse;width:100%;min-width:640px;}
th,td{border-bottom:1px solid #2c3238;padding:6px 9px;text-align:left;vertical-align:top;}
th{position:sticky;top:0;background:var(--panel2);color:#f2f6fb;font-size:12px;font-weight:650;z-index:1;}
tr:nth-child(even){background:#1c2024;}tr:hover{background:#242a30;}
.added{color:var(--green);}.removed{color:var(--red);}.changed{color:var(--amber);}
.diff-ins{background:#173d24;color:#c7f7ce;border-radius:3px;padding:0 2px;}
.diff-del{background:#4a1f22;color:#ffc5c0;border-radius:3px;padding:0 2px;text-decoration:line-through;}
.diff-summary{display:block;color:var(--amber);margin:0 0 6px;}
.diff-list{display:block;margin-top:4px;}
.changed-table{width:100%;min-width:900px;table-layout:fixed;}
.changed-table .field-col{width:220px;}
.changed-table .key-col{width:160px;}
.changed-table .id-col{width:90px;}
.changed-table .meta-col{width:240px;}
.changed-table pre{white-space:pre-wrap;word-break:break-word;}
.changed-table .field-name{padding-right:28px;}
.changed-table .id-cell,.changed-table .meta-cell,.changed-table .value-cell{padding-right:24px;}
.changed-entry{border:1px solid var(--border);border-radius:6px;background:#181b1e;margin:0 0 10px;overflow:hidden;}
.changed-entry-title{padding:8px 10px;border-bottom:1px solid var(--border);font-weight:650;color:var(--amber);display:flex;gap:8px;align-items:baseline;}
.changed-entry-id{color:var(--muted);font-family:Consolas,'Cascadia Mono',monospace;font-size:12px;font-weight:500;}
.changed-entry .table-wrap{border:0;border-radius:0;margin:0;}
.field-name{color:var(--blue);font-family:Consolas,monospace;}
button{padding:6px 10px;background:#242930;color:var(--text);border:1px solid var(--border);border-radius:6px;cursor:pointer;font:inherit;}
button:hover{background:#303741;}
pre{margin:0;background:transparent;padding:0;overflow:visible;white-space:pre-wrap;word-break:break-word;font-family:Consolas,'Cascadia Mono',monospace;font-size:12px;color:var(--text);}
.sprite-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;}
.sprite-card{border:1px solid var(--border);border-radius:6px;background:#181b1e;overflow:hidden;}
.sprite-title{padding:8px 10px;border-bottom:1px solid var(--border);font-weight:650;color:var(--blue);display:flex;gap:8px;align-items:baseline;}
.sprite-meta{color:var(--muted);font-family:Consolas,'Cascadia Mono',monospace;font-size:12px;font-weight:500;}
.sprite-frames{display:flex;flex-wrap:wrap;gap:8px;padding:10px;}
.sprite-frame{display:flex;flex-direction:column;gap:4px;align-items:center;min-width:54px;color:var(--muted);font-family:Consolas,'Cascadia Mono',monospace;font-size:11px;}
.sprite-frame img{max-width:160px;max-height:160px;image-rendering:pixelated;background:#0f1113;border:1px solid #2c3238;border-radius:4px;padding:4px;}
.sprite-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px;}
.sprite-side-title{margin:0 0 8px;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em;font-weight:650;}
.script-source{max-height:520px;overflow:auto;white-space:pre;word-break:normal;}
.script-diff{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0;border-top:1px solid var(--border);}
.script-pane{min-width:0;border-right:1px solid var(--border);}
.script-pane:last-child{border-right:0;}
.script-pane-title{padding:6px 10px;background:var(--panel2);border-bottom:1px solid var(--border);color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em;font-weight:650;}
.script-lines{max-height:640px;overflow:auto;font-family:Consolas,'Cascadia Mono',monospace;font-size:12px;white-space:pre;}
.script-line{display:block;min-height:16px;padding:0 8px;}
.script-line.same{color:var(--text);}
.script-line.ins{background:#173d24;color:#c7f7ce;}
.script-line.del{background:#4a1f22;color:#ffc5c0;}
.empty{color:var(--muted);font-style:italic;margin:4px 0 12px;}
</style>
</head>

              "LEAGUES_AREA_AUTOCOMPLETE(2022)": "The following quests and their pre-reqs are automatically completed but will not reward any completion XP:\u003cbr\u003e\u003cbr\u003e- Dragon Slayer\u003cbr\u003e- Druidic Ritual\u003cbr\u003e- Elemental Workshop I\u003cbr\u003e- Tears of Guthix\u003cbr\u003e- Bone Voyage\u003cbr\u003e- Fairytale II - Cure a Queen\u003cbr\u003e- Death to the Dorgeshuun\u003cbr\u003e- Gertrude\u0027s Cat\u003cbr\u003e- Romeo and Juliet\u003cbr\u003e- A Soul\u0027s Bane\u003cbr\u003e- Defender of Varrock (This does not complete pre-reqs)\u003cbr\u003e\u003cbr\u003ePlayers can enter the Ancient Guthixian Temple from the Chasm of Tears without WGS completed.\u003cbr\u003e\u003cbr\u003eThe following tasks in the Lumbridge and Draynor Achievement Diary are automatically completed:\u003cbr\u003e\u003cbr\u003eEasy Tasks:\u003cbr\u003e- Catch some Anchovies in Al Kharid\u003cbr\u003e- Mine some iron ore at the Al Kharid mine\u003cbr\u003e\u003cbr\u003eMedium Tasks:\u003cbr\u003e- Complete a lap of the Al Kharid Rooftop Course\u003cbr\u003e- Grapple across the River Lum\u003cbr\u003e- Craft some Lava Runes at the Fire Altar in Al Kharid\u003cbr\u003e- Purchase an upgraded device from Ava\u003cbr\u003e\u003cbr\u003eHard Tasks:\u003cbr\u003e- Cast Bones to Peaches in Al Kharid Palace\u003cbr\u003e- Collect 100 tears from Tears of Guthix\u003cbr\u003e- Recharge your Prayer at the Emir\u0027s Arena with Smite activated\u003cbr\u003e- Purchase some Barrows Gloves from the Culinaromancer\u0027s Chest\u003cbr\u003e- Take the train from Dorgesh-Kaan to Keldagrim\u003cbr\u003e\u003cbr\u003eElite Tasks:\u003cbr\u003e- Chop some Magic Logs at the Mage Training Arena\u003cbr\u003e- Perform the Quest Point Cape emote in the Wise Old Man\u0027s house\u003cbr\u003e\u003cbr\u003eThe following tasks in the Varrock Diary are automatically completed:\u003cbr\u003e\u003cbr\u003eMedium Tasks:\u003cbr\u003e- Select a colour for your kitten\u003cbr\u003e- Use the Spirit Tree in the north-eastern corner of Grand Exchange\u003cbr\u003e- Pick a White Tree Fruit\u003cbr\u003e- Use the balloon to travel from Varrock\u003cbr\u003e\u003cbr\u003eHard Tasks:\u003cbr\u003e- Trade furs with the Fancy Dress Seller for a Spottier Cape and equip it\u003cbr\u003e- Teleport to Paddewwa\u003cbr\u003e\u003cbr\u003eElite Tasks:\u003cbr\u003e- Use Lunar magic to make 20 Mahogany Planks in the Varrock Lumber Yard.\u003cbr\u003e- Smith and fletch ten Rune Darts while in Varrock.\u003cbr\u003e- Create a Summer Pie in the Cooks\u0027 Guild.\u003cbr\u003e\u003cbr\u003e- Mahogany homes tutorial is completed.",
              "LEAGUES_AREA_BOOSTED_DROPRATES(2023)": "The drops listed below are affected by the drop rate modifier perks granted by passive Relic unlocks.\u003cbr\u003e\u003cbr\u003eDrop rates affected are always rounded down and are not tied to area unlocks, this list represents the key drops affected in Misthalin.\u003cbr\u003e\u003cbr\u003e- Wyvern Visage from all sources\u003cbr\u003e- Draconic Visage from all sources\u003cbr\u003e- Dragon Limbs from all sources\u003cbr\u003e- Dragon Metal Slice from Adamant dragons\u003cbr\u003e- Dragon metal Lump from Rune dragons\u003cbr\u003e- Hill Giant Club from Obor\u003cbr\u003e- Bryophyta\u0027s Essence from Bryophyta\u003cbr\u003e- Beginner clue unique rewards\u003cbr\u003e- Easy clue unique rewards\u003cbr\u003e- Medium clue unique rewards\u003cbr\u003e- Hard clue unique rewards\u003cbr\u003e- Elite clue unique rewards\u003cbr\u003e- Master clue unique rewards\u003cbr\u003e- All unique rewards from Superior Slayer Creatures\u003cbr\u003e- Dragon pickaxes from all sources\u003cbr\u003e- All unique rewards from Tormented demons\u003cbr\u003e- All unique rewards from Scurrius\u003cbr\u003e- Broken Zombie Axe from Armoured Zombies\u003cbr\u003e\u003cbr\u003e",
              "LEAGUES_AREA_DESCRIPTION(2020)": "The Misthalin area covers the entire Kingdom of Misthalin as well as Fossil Island.\u003cbr\u003e\u003cbr\u003eInstances of areas in Misthalin and underground areas with an entrance in Misthalin will also be included.\u003cbr\u003e\u003cbr\u003eAccess to Al Kharid, Port Sarim and the western exit of Barbarian Village is blocked by magical barriers.\u003cbr\u003e\u003cbr\u003eAll transportation and teleportation through Charter Ships, Customs Officers, Gnome Gliders, Fairy Rings, Balloons, or any other transport system will require you to have unlocked access to the area your destination is in.\u003cbr\u003e\u003cbr\u003eThe following travel options are restricted unless you have access to the appropriate area:\u003cbr\u003e\u003cbr\u003e- The gate between Lumbridge and Al Kharid\u003cbr\u003e- The entrance to the Kalphite Hive from Dorgesh-Kaan Dungeon\u003cbr\u003e- The grapple shortcut between Lumbridge and Al Kharid\u003cbr\u003e- The stepping stone between Lumbridge Swamp and the Kalphite Lair\u003cbr\u003e- The under-wall shortcut between Draynor Village and Port Sarim\u003cbr\u003e- The underground sections of the Paterdomus Temple\u003cbr\u003e- The railing shortcut between the Paterdomus Temple and Canifis\u003cbr\u003e\u003cbr\u003e",
              "LEAGUES_AREA_SETTLEMENTS(2021)": "Notable Settlements:\u003cbr\u003e\u003cbr\u003e- Barbarian Village\u003cbr\u003e- Draynor Village\u003cbr\u003e- Edgeville\u003cbr\u003e- Fossil Island\u003cbr\u003e- Lumbridge\u003cbr\u003e- The Digsite\u003cbr\u003e- Varrock\u003cbr\u003e- Isle of Souls and Soul Wars\u003cbr\u003e- Dorgesh-Kaan\u003cbr\u003e- Lithkren Vault (if the Fremennik Province is unlocked)\u003cbr\u003e\u003cbr\u003eNotable combat-related activities:\u003cbr\u003e\u003cbr\u003e- Bryophyta\u003cbr\u003e- Edgeville Dungeon\u003cbr\u003e- Fossil Island Wyverns\u003cbr\u003e- Lumbridge Swamp Caves\u003cbr\u003e- Obor\u003cbr\u003e- Stronghold of Security\u003cbr\u003e- Scurrius the Rat King\u003cbr\u003e- Tormented Demons\u003cbr\u003e- Soul Wars\u003cbr\u003e\u003cbr\u003eNotable non-combat activities:\u003cbr\u003e\u003cbr\u003e- Champions\u0027 Guild\u003cbr\u003e- Draynor Village Rooftop Agility Course\u003cbr\u003e- Fossil Island Herbiboar\u003cbr\u003e- Fossil Island Hardwood Tree Patches\u003cbr\u003e- Fossil Island Sulliusceps Woodcutting\u003cbr\u003e- Fossil Island Volcanic Mine\u003cbr\u003e- Fossil Island Birdhouse spots\u003cbr\u003e- Puro-Puro Implings\u003cbr\u003e- Earth and Water Altars\u003cbr\u003e- Varrock Rooftop Agility Course\u003cbr\u003e- Lumbridge and Varrock Tree Patches\u003cbr\u003e\u003cbr\u003eExaminers will provide a level 3 certificate on request.\u003cbr\u003e\u003cbr\u003eThe following Misthalin shop stocks have been modified:\u003cbr\u003e\u003cbr\u003e- Pestle and Mortars and Fishing Bait have been added to the Lumbridge General Store\u003cbr\u003e\u003cbr\u003e"
            }
