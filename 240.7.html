<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<title>OSRS Cache Diff Report</title>
<style>
:root{color-scheme:dark;--bg:#151719;--panel:#202326;--panel2:#262a2e;--border:#343a40;--text:#d8dde3;--muted:#8d99a6;--blue:#7cc7ff;--green:#91d18b;--red:#f28b82;--amber:#f7c873;}
*{box-sizing:border-box;}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);margin:0;padding:0;font-size:14px;line-height:1.35;}
header{position:sticky;top:0;z-index:10;background:#1b1e21;border-bottom:1px solid var(--border);padding:12px 18px;display:flex;align-items:center;gap:14px;box-shadow:0 2px 10px #0004;}
h1{margin:0;color:#f2f6fb;font-size:20px;font-weight:650;}
.actions{margin-left:auto;display:flex;gap:8px;}
#content{max-width:1800px;margin:0 auto;padding:14px 18px 28px;}
section{background:var(--panel);border:1px solid var(--border);border-radius:8px;margin:0 0 12px;overflow:hidden;}
summary{cursor:pointer;font-weight:650;color:var(--blue);list-style:none;}
summary::-webkit-details-marker{display:none;}
.section-summary{display:flex;align-items:center;gap:10px;padding:12px 14px;}
.section-summary:before{content:'+';color:var(--muted);font-family:Consolas,monospace;width:14px;}
details[open]>.section-summary:before{content:'-';}
.section-title{min-width:190px;}
.badge{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--border);border-radius:999px;padding:2px 8px;background:#15181b;color:var(--muted);font-size:12px;font-weight:600;}
.body{border-top:1px solid var(--border);padding:12px 14px 16px;}
.bucket{border:1px solid var(--border);border-radius:6px;background:#181b1e;margin:0 0 8px;overflow:hidden;}
.bucket>.section-summary{padding:8px 10px;}
.bucket>.body{padding:10px;border-top:1px solid var(--border);}
.subhead{margin:14px 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);}
.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:6px;background:#181b1e;margin:0 0 12px;}
table{border-collapse:collapse;width:100%;min-width:640px;}
th,td{border-bottom:1px solid #2c3238;padding:6px 9px;text-align:left;vertical-align:top;}
th{position:sticky;top:0;background:var(--panel2);color:#f2f6fb;font-size:12px;font-weight:650;z-index:1;}
tr:nth-child(even){background:#1c2024;}tr:hover{background:#242a30;}
.added{color:var(--green);}.removed{color:var(--red);}.changed{color:var(--amber);}
.diff-ins{background:#173d24;color:#c7f7ce;border-radius:3px;padding:0 2px;}
.diff-del{background:#4a1f22;color:#ffc5c0;border-radius:3px;padding:0 2px;text-decoration:line-through;}
.diff-summary{display:block;color:var(--amber);margin:0 0 6px;}
.diff-list{display:block;margin-top:4px;}
.changed-table{width:100%;min-width:900px;table-layout:fixed;}
.changed-table .field-col{width:220px;}
.changed-table .key-col{width:160px;}
.changed-table .id-col{width:90px;}
.changed-table .meta-col{width:240px;}
.changed-table pre{white-space:pre-wrap;word-break:break-word;}
.changed-table .field-name{padding-right:28px;}
.changed-table .id-cell,.changed-table .meta-cell,.changed-table .value-cell{padding-right:24px;}
.changed-entry{border:1px solid var(--border);border-radius:6px;background:#181b1e;margin:0 0 10px;overflow:hidden;}
.changed-entry-title{padding:8px 10px;border-bottom:1px solid var(--border);font-weight:650;color:var(--amber);display:flex;gap:8px;align-items:baseline;}
.changed-entry-id{color:var(--muted);font-family:Consolas,'Cascadia Mono',monospace;font-size:12px;font-weight:500;}
.changed-entry .table-wrap{border:0;border-radius:0;margin:0;}
.field-name{color:var(--blue);font-family:Consolas,monospace;}
button{padding:6px 10px;background:#242930;color:var(--text);border:1px solid var(--border);border-radius:6px;cursor:pointer;font:inherit;}
button:hover{background:#303741;}
pre{margin:0;background:transparent;padding:0;overflow:visible;white-space:pre-wrap;word-break:break-word;font-family:Consolas,'Cascadia Mono',monospace;font-size:12px;color:var(--text);}
.sprite-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;}
.sprite-card{border:1px solid var(--border);border-radius:6px;background:#181b1e;overflow:hidden;}
.sprite-title{padding:8px 10px;border-bottom:1px solid var(--border);font-weight:650;color:var(--blue);display:flex;gap:8px;align-items:baseline;}
.sprite-meta{color:var(--muted);font-family:Consolas,'Cascadia Mono',monospace;font-size:12px;font-weight:500;}
.sprite-frames{display:flex;flex-wrap:wrap;gap:8px;padding:10px;}
.sprite-frame{display:flex;flex-direction:column;gap:4px;align-items:center;min-width:54px;color:var(--muted);font-family:Consolas,'Cascadia Mono',monospace;font-size:11px;}
.sprite-frame img{max-width:160px;max-height:160px;image-rendering:pixelated;background:#0f1113;border:1px solid #2c3238;border-radius:4px;padding:4px;}
.sprite-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px;}
.sprite-side-title{margin:0 0 8px;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em;font-weight:650;}
.script-source{max-height:520px;overflow:auto;white-space:pre;word-break:normal;}
.script-diff{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0;border-top:1px solid var(--border);}
.script-pane{min-width:0;border-right:1px solid var(--border);}
.script-pane:last-child{border-right:0;}
.script-pane-title{padding:6px 10px;background:var(--panel2);border-bottom:1px solid var(--border);color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em;font-weight:650;}
.script-lines{max-height:640px;overflow:auto;font-family:Consolas,'Cascadia Mono',monospace;font-size:12px;white-space:pre;}
.script-line{display:block;min-height:16px;padding:0 8px;}
.script-line.same{color:var(--text);}
.script-line.ins{background:#173d24;color:#c7f7ce;}
.script-line.del{background:#4a1f22;color:#ffc5c0;}
.empty{color:var(--muted);font-style:italic;margin:4px 0 12px;}
</style>
</head>

              "\u003ccol\u003dffffff\u003eTorag the Corrupted:\u003cbr\u003e\u003cbr\u003eCorruption +:\u003cbr\u003e\u003cbr\u003eSuccessful melee attacks have a 25% chance of lowering the victim\u0027s run energy by 20%.\u003cbr\u003e\u003cbr\u003eFor every hitpoint lost from your maximum hitpoints, your Defence stat gets an invisible boost.\u003cbr\u003e\u003cbr\u003e",
              "\u003ccol\u003dffffff\u003eTorag the Corrupted:\u003cbr\u003e\u003cbr\u003eCorruption ++:\u003cbr\u003e\u003cbr\u003eSuccessful melee attacks have a 50% chance of lowering the victim\u0027s run energy by 20%.\u003cbr\u003e\u003cbr\u003eFor every hitpoint lost from your maximum hitpoints, your Defence stat gets an invisible boost.\u003cbr\u003e\u003cbr\u003e",
              "\u003ccol\u003dffffff\u003eVerac the Defiled:\u003cbr\u003e\u003cbr\u003eDefiler:\u003cbr\u003e\u003cbr\u003eAttacks have a 25% chance of ignoring any armour, Defence, and protection prayers.\u003cbr\u003e\u003cbr\u003e",
              "\u003ccol\u003dffffff\u003eVerac the Defiled:\u003cbr\u003e\u003cbr\u003eDefiler +:\u003cbr\u003e\u003cbr\u003eAttacks have a 25% chance of ignoring any armour, Defence, and protection prayers.\u003cbr\u003e\u003cbr\u003eGives a +7 prayer bonus.\u003cbr\u003e\u003cbr\u003e",
              "\u003ccol\u003dffffff\u003eVerac the Defiled:\u003cbr\u003e\u003cbr\u003eDefiler ++:\u003cbr\u003e\u003cbr\u003eAttacks have a 50% chance of ignoring any armour, Defence, and protection prayers.\u003cbr\u003e\u003cbr\u003eGives a +14 prayer bonus.\u003cbr\u003e\u003cbr\u003e",
              "\u003ccol\u003dffffff\u003eGraceful Outfit:\u003cbr\u003e\u003cbr\u003eEach individual piece of the Graceful Outfit increases your run restoration rate.\u003cbr\u003e\u003cbr\u003eWearing the full Graceful Outfit increases run energy restoration by 30%.\u003cbr\u003e\u003cbr\u003e",
              "\u003ccol\u003dffffff\u003eObsidian armour:\u003cbr\u003e\u003cbr\u003eAll obsidian weaponry will be given a 10% boost in melee accuracy and melee strength.\u003cbr\u003e\u003cbr\u003e",
              "\u003ccol\u003dffffff\u003eVoid Knight Melee:\u003cbr\u003e\u003cbr\u003eWhen wearing the Void Top, Robe, Gloves and Melee Helmet, you will receive +10% bonus to your melee damage and accuracy.\u003cbr\u003e\u003cbr\u003e",
              "\u003ccol\u003dffffff\u003eVoid Knight Range:\u003cbr\u003e\u003cbr\u003eWhen wearing the Void Top, Robe, Gloves and Ranger Helmet, you will receive +10% bonus to your ranged damage and accuracy.\u003cbr\u003e\u003cbr\u003e",
              "\u003ccol\u003dffffff\u003eVoid Knight Elite Range:\u003cbr\u003e\u003cbr\u003eWhen wearing the Elite Void Top, Elite Robe, Gloves and Ranger Helmet, you will receive +12.5% bonus to your ranged damage and 10% bonus to accuracy.\u003cbr\u003e\u003cbr\u003e",
              "\u003ccol\u003dffffff\u003eVoid Knight Mage:\u003cbr\u003e\u003cbr\u003eWhen wearing the Void Top, Robe, Gloves and Mage Helmet, you will receive +45% bonus to your magic accuracy.\u003cbr\u003e\u003cbr\u003e",
              "\u003ccol\u003dffffff\u003eVoid Knight Elite Mage:\u003cbr\u003e\u003cbr\u003eWhen wearing the Elite Void Top, Elite Robe, Gloves and Mage Helmet, you will receive a +45% bonus to your magic accuracy and 5% to your magic damage.\u003cbr\u003e\u003cbr\u003e",
              "\u003ccol\u003dffffff\u003eJusticiar:\u003cbr\u003e\u003cbr\u003ePvM damage dealt to you is reduced according to your total armour protection in that style.\u003cbr\u003e\u003cbr\u003e",
              "\u003ccol\u003dffffff\u003eAngler outfit:\u003cbr\u003e\u003cbr\u003eXP from training Fishing will be increased by 2.5% if the full set is worn. Incomplete sets give smaller bonuses.\u003cbr\u003e\u003cbr\u003e",
              "\u003ccol\u003dffffff\u003eLumberjack outfit:\u003cbr\u003e\u003cbr\u003eXP from training Woodcutting will be increased by 2.5% if the full set is worn. Incomplete sets give smaller bonuses.\u003cbr\u003e\u003cbr\u003e",
              "\u003ccol\u003dffffff\u003eProspector outfit:\u003cbr\u003e\u003cbr\u003eXP from training Mining will be increased by 2.5% if the full set is worn. Incomplete sets give smaller bonuses.\u003cbr\u003e\u003cbr\u003e",
              "\u003ccol\u003dffffff\u003eFarmer outfit:\u003cbr\u003e\u003cbr\u003eXP from training Farming will be increased by 2.5% if the full set is worn. Incomplete sets give smaller bonuses.\u003cbr\u003e\u003cbr\u003e",
              "\u003ccol\u003dffffff\u003ePyromancer outfit:\u003cbr\u003e\u003cbr\u003eXP from training Firemaking will be increased by 2.5% if the full set is worn. Incomplete sets give smaller bonuses.\u003cbr\u003e\u003cbr\u003e",
              "\u003ccol\u003dffffff\u003eShayzien armour:\u003cbr\u003e\u003cbr\u003eReduces the damage of the acid splash attack used by Lizardman Shamans.\u003cbr\u003e\u003cbr\u003e",
              "\u003ccol\u003dffffff\u003eRogue kit:\u003cbr\u003e\u003cbr\u003eThe full set gives a 100% chance of double loot from standard pickpocketing. Incomplete sets give smaller chances.\u003cbr\u003e\u003cbr\u003e",
              "\u003ccol\u003dffffff\u003eCarpenter\u0027s outfit:\u003cbr\u003e\u003cbr\u003eXP from training Construction will be increased by 2.5% if the full set is worn. Incomplete sets give smaller bonuses.\u003cbr\u003e\u003cbr\u003e",
              "\u003ccol\u003dffffff\u003eCrystal armour:\u003cbr\u003e\u003cbr\u003eEach individual piece of Crystal Armour increases your accuracy and damage with crystal ranged weaponry.\u003cbr\u003e\u003cbr\u003eWearing the full set of Crystal Armour increases accuracy by 30% and damage by 15%.\u003cbr\u003e\u003cbr\u003e",
              "\u003ccol\u003dffffff\u003eSwampbark Armour:\u003cbr\u003e\u003cbr\u003eWearing the helm, body, and legs increases the duration of Bind, Snare and Entangle spells by 3.6 seconds\u003cbr\u003e\u003cbr\u003e",
              "\u003ccol\u003dffffff\u003eBloodbark Armour:\u003cbr\u003e\u003cbr\u003eThe full set increases the amount healed by Blood spells to 35.0%.\u003cbr\u003e\u003cbr\u003e",
              "\u003ccol\u003dffffff\u003eZealot\u0027s prayer robes:\u003cbr\u003e\u003cbr\u003eThe full set grants a 5% chance of saving ensouled heads when reanimating them, bones when burying or offering them, and bonemeal \u0026 slime at the Ectofuntus. This stacks with the Wilderness altar\u0027s bone saving effect.\u003cbr\u003e\u003cbr\u003e",
              "\u003ccol\u003dffffff\u003eSpirit Angler outfit:\u003cbr\u003e\u003cbr\u003eXP from training Fishing will be increased by 2.5% if the full set is worn. Incomplete sets give smaller bonuses.\u003cbr\u003e\u003cbr\u003eFull set acts as a tether rope when fighting Tempoross.\u003cbr\u003e\u003cbr\u003e",
              "\u003ccol\u003dffffff\u003eVirtus Robes:\u003cbr\u003e\u003cbr\u003e6% increased Magic damage and an additional 9% increased Magic damage with ancient spells.\u003cbr\u003e\u003cbr\u003e",
              "\u003ccol\u003dffffff\u003eRaiments of the Eye:\u003cbr\u003e\u003cbr\u003eRunes crafted are increased by 60%.\u003cbr\u003e\u003cbr\u003eThis bonus stacks additively with other similar effects.\u003cbr\u003e\u003cbr\u003e",
              "\u003ccol\u003dffffff\u003eSmith\u0027s Uniform:\u003cbr\u003e\u003cbr\u003eThe full set increases the rate you will smith items at an anvil by 1 tick.\u003cbr\u003e\u003cbr\u003e",
              "\u003ccol\u003dffffff\u003eStatius\u0027s Equipment:\u003cbr\u003e\u003cbr\u003eMelee special attacks have 15% increased accuracy.\u003cbr\u003e\u003cbr\u003e",
              "\u003ccol\u003dffffff\u003eVesta\u0027s Equipment:\u003cbr\u003e\u003cbr\u003eMelee special attacks have 15% increased accuracy.\u003cbr\u003e\u003cbr\u003e",
              "\u003ccol\u003dffffff\u003eMorrigan\u0027s Equipment:\u003cbr\u003e\u003cbr\u003eRanged special attacks have 15% increased accuracy.\u003cbr\u003e\u003cbr\u003e",
              "\u003ccol\u003dffffff\u003eZuriel\u0027s Equipment:\u003cbr\u003e\u003cbr\u003eMagic special attacks have 25% increased accuracy.\u003cbr\u003e\u003cbr\u003e",
              "\u003ccol\u003dffffff\u003eStatius\u0027s Corrupt Equipment:\u003cbr\u003e\u003cbr\u003eMelee special attacks have 15% increased accuracy.\u003cbr\u003e\u003cbr\u003e",
              "\u003ccol\u003dffffff\u003eVesta\u0027s Corrupt Equipment:\u003cbr\u003e\u003cbr\u003eMelee special attacks have 15% increased accuracy.\u003cbr\u003e\u003cbr\u003e",
              "\u003ccol\u003dffffff\u003eMorrigan\u0027s Corrupt Equipment:\u003cbr\u003e\u003cbr\u003eRanged special attacks have 15% increased accuracy.\u003cbr\u003e\u003cbr\u003e",
              "\u003ccol\u003dffffff\u003eZuriel\u0027s Corrupt Equipment:\u003cbr\u003e\u003cbr\u003eMagic special attacks have 25% increased accuracy.\u003cbr\u003e\u003cbr\u003e",
              "\u003ccol\u003dffffff\u003eBloodrager Effect:\u003cbr\u003e\u003cbr\u003eSuccessful hits with the Dual Macuahuitl have a 33% chance of reducing the delay of your next attack by 1 tick.\u003cbr\u003e\u003cbr\u003eThe Dual Macuahuitl gains the \u0027Blood Infusion\u0027 special attack.\u003cbr\u003e\u003cbr\u003e",
              "\u003ccol\u003dffffff\u003eFrostweaver Effect:\u003cbr\u003e\u003cbr\u003eCasting spells which bind the enemy has a 50% chance to allow the next attack with the Blue Moon spear to bypass the action delay.\u003cbr\u003e\u003cbr\u003eThe Blue Moon spear gains the \u0027Break Shackles\u0027 special attack.\u003cbr\u003e\u003cbr\u003e",
              "\u003ccol\u003dffffff\u003eFrostweaver Effect Set:\u003cbr\u003e\u003cbr\u003eCasting spells which bind the enemy has a 20% chance to allow the next attack with the Blue Moon spear to bypass the action delay.\u003cbr\u003e\u003cbr\u003eThe Blue Moon spear gains the \u0027Break Shackles\u0027 special attack.\u003cbr\u003e\u003cbr\u003e",
              "\u003ccol\u003dffffff\u003eEclipse Effect:\u003cbr\u003e\u003cbr\u003eSuccessful hits with the Eclipse Atlatl have a 20% chance to apply a burn effect to the enemy.\u003cbr\u003e\u003cbr\u003eThe Eclipse Atlatl gains the \u0027Eclipse\u0027 special attack.\u003cbr\u003e\u003cbr\u003e",
              "\u003ccol\u003dffffff\u003eHunter\u0027s Armour:\u003cbr\u003e\u003cbr\u003eDamage taken from hunter creatures is reduced by 60%.\u003cbr\u003e\u003cbr\u003e",
              "\u003ccol\u003dffffff\u003eHunter\u0027s Armour:\u003cbr\u003e\u003cbr\u003eDamage taken from hunter creatures is reduced by 40%.\u003cbr\u003e\u003cbr\u003e",
              "\u003ccol\u003dffffff\u003eHunter\u0027s Armour:\u003cbr\u003e\u003cbr\u003eDamage taken from hunter creatures is reduced by 20%.\u003cbr\u003e\u003cbr\u003e",
              "\u003ccol\u003dffffff\u003eGuild Hunter Outfit:\u003cbr\u003e\u003cbr\u003eIncreases catch chance of hunter creatures by up to 2.5%, and increases rare creature part droprate when doing Hunters\u0027 Rumours by up to 5%.\u003cbr\u003e\u003cbr\u003e",
              "\u003ccol\u003dffffff\u003eInquisitor\u0027s armour:\u003cbr\u003e\u003cbr\u003eEach individual piece of Inquisitor\u0027s armour boosts damage and accuracy by 2.5% when using the crush attack style and having the Inquisitor\u0027s mace equipped.\u003cbr\u003e\u003cbr\u003e"
